<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astro Stars — Assistance</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d14; --ink:#eee7d7; --mist:#a0a2b0; --amber:#ecb96b; }
    body { margin:0; font:16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:40rem; margin:0 auto; padding:3rem 1.25rem 4rem; }
    h1 { font-family: "New York", "Times New Roman", serif; font-weight:600; font-size:2rem; margin:0 0 .5rem; }
    .eyebrow { color:var(--amber); letter-spacing:.08em; text-transform:uppercase; font-size:.75rem; font-weight:600; }
    p, li { color:var(--mist); }
    a { color:var(--amber); }
    .card { margin-top:1.75rem; padding:1.25rem 1.35rem; border:1px solid rgba(238,231,215,.12); border-radius:1rem; background:rgba(255,255,255,.03); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Astro Stars</p>
    <h1>Assistance</h1>
    <p>Besoin d’aide avec Astro Stars&nbsp;? Écris-nous — on répond en français ou en anglais.</p>
    <div class="card">
      <p><strong style="color:var(--ink)">E-mail</strong><br />
        <a href="mailto:support@appsdev.com?subject=Astro%20Stars">support@appsdev.com</a></p>
      <p>Indique ton appareil, la version d’iOS et une capture d’écran si possible.</p>
    </div>
    <p style="margin-top:2rem"><a href="../privacy/">Politique de confidentialité</a></p>
  </main>
</body>
</html>
